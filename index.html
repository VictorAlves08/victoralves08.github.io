<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Links oficiais de Victor Alves — desenvolvedor e criador do Rodízio SP.">
  <meta name="theme-color" content="#0b1020">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Victor Alves | Links">
  <meta property="og:description" content="Encontre meus projetos e redes profissionais.">
  <meta property="og:url" content="https://victoralves08.github.io/">
  <title>Victor Alves | Links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d1a;
      --surface: rgba(20, 27, 51, .78);
      --text: #f5f7ff;
      --muted: #b4bed8;
      --line: rgba(178, 193, 255, .2);
      --accent: #8b5cf6;
      --accent-2: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 12% 0%, rgba(56, 189, 248, .18), transparent 34rem), radial-gradient(circle at 88% 100%, rgba(139, 92, 246, .22), transparent 34rem), var(--bg);
    }

    main {
      width: min(100%, 42rem);
      padding: 3.5rem 1.25rem 2rem;
      text-align: center;
    }

    .profile {
      margin-bottom: 2rem;
    }

    .avatar {
      width: 6.5rem;
      height: 6.5rem;
      display: block;
      margin: 0 auto 1rem;
      border: 3px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(139, 92, 246, .24), 0 16px 38px rgba(0, 0, 0, .35);
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.2rem);
      letter-spacing: -.035em;
    }

    .bio {
      max-width: 33rem;
      margin: .6rem auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .links {
      display: grid;
      gap: .9rem;
    }

    .link-card {
      position: relative;
      min-height: 4.4rem;
      display: grid;
      grid-template-columns: 2.5rem 1fr 2.5rem;
      align-items: center;
      padding: .65rem 1rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
      backdrop-filter: blur(13px);
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: rgba(125, 211, 252, .7);
      background: rgba(29, 39, 71, .95);
      box-shadow: 0 15px 34px rgba(0, 0, 0, .25);
    }

    .link-card:focus-visible,
    .back-home:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }

    .link-icon,
    .arrow {
      display: grid;
      place-items: center;
      width: 2.2rem;
      height: 2.2rem;
    }

    .link-icon {
      color: var(--accent-2);
    }

    .link-icon svg,
    .arrow svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: currentColor;
    }

    .link-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .arrow {
      color: #c5d0ed;
      transition: transform .2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(3px);
    }

    footer {
      margin-top: 2rem;
      color: #8793b2;
      font-size: .84rem;
    }

    @media (max-width: 430px) {
      main {
        padding-top: 2.5rem;
      }

      .link-title {
        font-size: .94rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
