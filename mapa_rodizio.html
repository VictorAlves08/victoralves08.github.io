<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Rodízio SP - Centro Expandido (CET Oficial)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    /* Container do Rodapé: Aviso Acima + Botões Abaixo */
    .bottom-container {
      position: fixed;
      bottom: 14px;
      left: 12px;
      right: 12px;
      max-width: 480px;
      margin: 0 auto;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      box-sizing: border-box;
    }

    .bottom-container>* {
      pointer-events: auto;
      box-sizing: border-box;
    }

    /* Card de Aviso / Status no Topo do Painel */
    .status-card {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.96);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      text-align: center;
      border: 1.5px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      overflow: hidden;
      word-break: break-word;
    }

    .status-card.searching {
      border-color: #38bdf8;
      color: #bae6fd;
    }

    .status-card.inside {
      background: rgba(225, 29, 72, 0.95);
      border-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.5);
    }

    .status-card.outside {
      background: rgba(15, 23, 42, 0.95);
      border-color: #10b981;
      color: #f8fafc;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
    }

    .status-title {
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-subtitle {
      font-size: 11px;
      opacity: 0.9;
      font-weight: 400;
    }

    /* Barra de Botões de Ação Abaixo do Aviso */
    .action-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .action-btn {
      flex: 1;
      height: 46px;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .action-btn.gps {
      border: 1.5px solid #0284c7;
      color: #e0f2fe;
    }

    .action-btn.gps svg {
      fill: #38bdf8;
    }

    .action-btn.gps:active {
      background: rgba(2, 132, 199, 0.3);
      border-color: #38bdf8;
      transform: scale(0.97);
    }

    .action-btn.area {
      border: 1.5px solid #e11d48;
      color: #ffe4e6;
    }

    .action-btn.area svg {
      fill: #f43f5e;
    }

    .action-btn.area:active {
      background: rgba(225, 29, 72, 0.3);
      border-color: #f43f5e;
      transform: scale(0.97);
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .pulse-animation {
      animation: opacity-pulse 1.5s ease-in-out infinite;
    }

    @keyframes opacity-pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="bottom-container">
    <div id="status" class="status-card searching">
      <div class="status-title pulse-animation">
        <span>📡</span> Aguardando localização do GPS...
      </div>
      <div class="status-subtitle">
        O status será calculado pela sua localização atual
      </div>
    </div>

    <div class="action-bar">
      <button id="gpsBtn" class="action-btn gps" title="Centralizar na minha localização"
        aria-label="Minha Localização">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
        </svg>
        <span>Minha Localização</span>
      </button>

      <button id="rodizioAreaBtn" class="action-btn area" title="Ver toda a Área de Rodízio"
        aria-label="Área de Rodízio">
        <svg viewBox="0 0 24 24">
          <path
            d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z" />
        </svg>
        <span>Área de Rodízio</span>
      </button>
    </div>
  </div>

    // Polígono de preenchimento da área interna restrita
    const polygon = L.polygon(perimeterCoords, {
      color: '#e11d48',
      fillColor: '#ef4444',
      fillOpacity: 0.22,
      weight: 3.5,
      dashArray: '6, 6'
    }).addTo(map);

    let userCircleMarker = null;
    let userAccuracyCircle = null;
    let hasCenteredOnUser = false;
    let lastUserLocation = null;

    // Enquadra perfeitamente todo o Centro Expandido
    function showRodizioArea() {
      map.fitBounds(polygon.getBounds(), {
        padding: [25, 25],
        maxZoom: 13,
        animate: true,
        duration: 1
      });
    }

    document.getElementById('rodizioAreaBtn')?.addEventListener('click', showRodizioArea);

    // Cálculo da menor distância em metros até um segmento de reta (para vias limítrofes)
    function distanceToSegmentMeters(lat, lng, lat1, lng1, lat2, lng2) {
      const R = 6371000; // Raio da Terra em metros
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;

      const x = (lng - lng1) * Math.cos((lat1 + lat2) * Math.PI / 360) * Math.PI / 180 * R;
      const y = (lat - lat1) * Math.PI / 180 * R;
      const dx = dLng * Math.cos((lat1 + lat2) * Math.PI / 360) * R;
      const dy = dLat * R;

      const dot = x * dx + y * dy;
      const lenSq = dx * dx + dy * dy;
      let param = -1;
      if (lenSq !== 0) param = dot / lenSq;

      let xx, yy;
      if (param < 0) {
        xx = 0; yy = 0;
      } else if (param > 1) {
        xx = dx; yy = dy;
      } else {
        xx = param * dx;
        yy = param * dy;
      }

      return Math.sqrt((x - xx) ** 2 + (y - yy) ** 2);
    }

    // Checa se o ponto está dentro do polígono OU sobre as vias de contorno (tolerância ~50m da pista)
    function isInsideRodizioArea(point, vs) {
      const lat = point[0], lng = point[1];
      let inside = false;

      // 1. Ray-Casting clássico para verificar interior
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const viLat = vs[i][0], viLng = vs[i][1];
        const vjLat = vs[j][0], vjLng = vs[j][1];

        const intersect = ((viLat > lat) !== (vjLat > lat))
          && (lng < (vjLng - viLng) * (lat - viLat) / (vjLat - viLat) + viLng);

        if (intersect) inside = !inside;

        // 2. Se não estiver dentro pelo polígono, verifica se está sobre a via limítrofe (Marginais/Bandeirantes)
        if (!inside) {
          const dist = distanceToSegmentMeters(lat, lng, viLat, viLng, vjLat, vjLng);
          if (dist <= 50) return true; // Dentro da faixa de pista da via de borda
        }
      }
      return inside;
    }

    // Atualização infalível da posição do usuário
    function updateUserPin(lat, lng, accuracy) {
      if (typeof lat !== 'number' || typeof lng !== 'number' || isNaN(lat) || isNaN(lng)) return;

      lastUserLocation = [lat, lng];

      // Marcador do usuário
      if (!userCircleMarker) {
        userCircleMarker = L.circleMarker([lat, lng], {
          radius: 9,
          color: '#ffffff',
          weight: 3.5,
          fillColor: '#0284c7',
          fillOpacity: 1,
          zIndexOffset: 1000
        }).addTo(map);

      } else {
        userCircleMarker.setLatLng([lat, lng]);
      }

      // Raio de precisão GPS
      const accRadius = accuracy && typeof accuracy === 'number' && accuracy > 0 ? Math.min(accuracy, 250) : 60;
      if (!userAccuracyCircle) {
        userAccuracyCircle = L.circle([lat, lng], {
          radius: accRadius,
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.16,
          weight: 1.5
        }).addTo(map);
      } else {
        userAccuracyCircle.setLatLng([lat, lng]);
        userAccuracyCircle.setRadius(accRadius);
      }

      // Centralização suave inicial
      if (!hasCenteredOnUser) {
        map.setView([lat, lng], 14, { animate: true });
        hasCenteredOnUser = true;
      }

      // Validação de entrada na restrição
      const inside = isInsideRodizioArea([lat, lng], perimeterCoords);
      const statusEl = document.getElementById('status');
      const coordsText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

      if (statusEl) {
        statusEl.classList.remove('searching');
        if (inside) {
          statusEl.className = 'status-card inside';
          statusEl.innerHTML = `
            <div class="status-title">⚠️ Você está DENTRO do Rodízio</div>
            <div class="status-subtitle">Picos: 07h-10h e 17h-20h (Seg a Sex)</div>
          `;
        } else {
          statusEl.className = 'status-card outside';
          statusEl.innerHTML = `
            <div class="status-title">✅ Você está FORA do Rodízio</div>
            <div class="status-subtitle">Circulação livre de restrição nesta via</div>
          `;
        }
      }
    }

    // Exposição global de funções
    window.updateLocation = updateUserPin;
    window.updateUserPin = updateUserPin;
    window.showRodizioArea = showRodizioArea;

    // Checagem de parâmetros de URL
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLat = parseFloat(urlParams.get('lat') || urlParams.get('latitude'));
      const urlLng = parseFloat(urlParams.get('lng') || urlParams.get('longitude'));
      const urlAcc = parseFloat(urlParams.get('acc') || urlParams.get('accuracy'));
      if (!isNaN(urlLat) && !isNaN(urlLng)) {
        updateUserPin(urlLat, urlLng, !isNaN(urlAcc) ? urlAcc : undefined);
      }
    } catch (e) { }

    // Polling de variáveis injetadas
    if (window.__PENDING_LOC__) {
      updateUserPin(window.__PENDING_LOC__[0], window.__PENDING_LOC__[1], window.__PENDING_LOC__[2]);
    }
    setInterval(function () {
      if (window.__PENDING_LOC__) {
        const loc = window.__PENDING_LOC__;
        window.__PENDING_LOC__ = null;
        updateUserPin(loc[0], loc[1], loc[2]);
      }
    }, 250);

    // Botão GPS
    document.getElementById('gpsBtn')?.addEventListener('click', function () {
      if (lastUserLocation) {
        map.flyTo(lastUserLocation, 15, { duration: 1 });
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            updateUserPin(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { duration: 1 });
          },
          function () { },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }
    });

    // Listener de comunicação bidirecional com React Native WebView
    function handleAppMessage(event) {
      try {
        const rawData = event.data;
        const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
        if (!data) return;

        if (data.type === 'SET_USER_LOCATION' || data.type === 'SET_LOCATION') {
          const latitude = data.latitude !== undefined ? Number(data.latitude) : Number(data.lat);
          const longitude = data.longitude !== undefined ? Number(data.longitude) : Number(data.lng);
          const accuracy = data.accuracy !== undefined ? Number(data.accuracy) : undefined;

          if (!isNaN(latitude) && !isNaN(longitude)) {
            updateUserPin(latitude, longitude, accuracy);
          }
        } else if (data.type === 'SHOW_RODIZIO_AREA') {
          showRodizioArea();
        }
      } catch (err) { }
    }

    window.addEventListener('message', handleAppMessage);
    document.addEventListener('message', handleAppMessage);

    // Notificar o React Native que o mapa carregou com sucesso
    try {
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'MAP_READY' }));
      }
    } catch (e) { }
  </script>
